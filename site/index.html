<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮汐｜籌碼觀測站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1620;
    --panel:#141F2B;
    --panel-2:#182531;
    --line:rgba(232,237,242,0.09);
    --line-strong:rgba(232,237,242,0.16);
    --text:#E8EDF2;
    --text-muted:#8B99A6;
    --text-faint:#5C6B79;
    --brass:#C6A15B;
    --brass-dim:#8A7240;
    --rise:#E1594F;
    --fall:#3FAE72;
    --radius-s:3px;
    --radius-m:6px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Noto Serif TC', serif;
    margin:0;
    font-weight:700;
    letter-spacing:0.01em;
  }
  .mono{
    font-family:'IBM Plex Mono','SFMono-Regular',monospace;
    font-variant-numeric:tabular-nums;
  }
  a{color:inherit;}
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:3px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
  }

  .wrap{max-width:1120px; margin:0 auto; padding:0 28px;}

  /* ---------- nav ---------- */
  header.site{
    position:sticky; top:0; z-index:40;
    background:rgba(14,22,32,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand-mark{font-family:'Noto Serif TC',serif; font-size:22px; font-weight:700; color:var(--text);}
  .brand-sub{font-size:12px; color:var(--text-faint);}
  nav.links{display:flex; gap:26px; font-size:14px;}
  nav.links a{text-decoration:none; color:var(--text-muted); transition:color .15s ease;}
  nav.links a:hover{color:var(--brass);}
  nav.links a[aria-current="page"]{color:var(--brass);}
  .nav-cta{
    font-size:13px; color:var(--ink); background:var(--brass);
    padding:8px 16px; border-radius:var(--radius-s); text-decoration:none;
    font-weight:500;
  }
  .nav-toggle{display:none;}

  /* ---------- hero ---------- */
  .hero{padding:76px 0 0;}
  .hero-grid{
    display:grid; grid-template-columns:1.15fr 0.85fr; gap:56px; align-items:start;
  }
  .hero h1{font-size:44px; line-height:1.32; max-width:12.5em;}
  .hero p.lede{
    margin-top:22px; font-size:16px; color:var(--text-muted); max-width:36em;
  }
  .hero-actions{margin-top:32px; display:flex; gap:14px; align-items:center;}
  .btn-primary{
    background:var(--brass); color:var(--ink); border:none; padding:12px 22px;
    border-radius:var(--radius-s); font-size:14px; font-weight:700; cursor:pointer;
    font-family:inherit;
  }
  .btn-ghost{
    background:transparent; color:var(--text); border:1px solid var(--line-strong);
    padding:12px 22px; border-radius:var(--radius-s); font-size:14px; cursor:pointer;
    font-family:inherit;
  }
  .hero-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:20px;
  }
  .hero-panel-label{font-size:12px; color:var(--text-faint); margin-bottom:14px;}
  .snap-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .snap-row:last-child{border-bottom:none;}
  .snap-name{color:var(--text-muted);}
  .snap-code{color:var(--text-faint); font-size:12px; margin-left:6px;}
  .up{color:var(--rise);}
  .down{color:var(--fall);}

  /* ticker */
  .ticker{
    margin-top:56px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    overflow:hidden; white-space:nowrap; background:var(--panel);
  }
  .ticker-track{
    display:inline-flex; animation:scroll 38s linear infinite;
    padding:13px 0;
  }
  .ticker-track span{
    display:inline-flex; align-items:center; gap:8px;
    padding:0 26px; font-size:13px; color:var(--text-muted);
    border-right:1px solid var(--line);
  }
  .ticker-track span b{color:var(--text); font-weight:500;}
  @keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  /* ---------- section shell ---------- */
  section.feature{padding:96px 0;}
  section.feature.alt{background:var(--panel);}
  .feature-head{
    display:grid; grid-template-columns:0.9fr 1.1fr; gap:56px; margin-bottom:44px;
  }
  .feature-head .eyebrow{
    font-size:13px; color:var(--brass); margin-bottom:10px;
  }
  .feature-head h2{font-size:30px; line-height:1.4; max-width:11em;}
  .feature-head .desc{color:var(--text-muted); font-size:14.5px; align-self:end;}

  /* table (分點籌碼) */
  table.chips{width:100%; border-collapse:collapse; font-size:14px;}
  table.chips th{
    text-align:left; font-weight:500; color:var(--text-faint); font-size:12px;
    padding:0 14px 12px; border-bottom:1px solid var(--line-strong);
  }
  table.chips td{padding:15px 14px; border-bottom:1px solid var(--line);}
  table.chips tbody tr{transition:background .15s ease;}
  table.chips tbody tr:hover{background:var(--panel-2);}
  .stock-name{color:var(--text);}
  .stock-code{color:var(--text-faint); font-size:12px; margin-left:6px;}
  .streak{color:var(--text-muted);}

  /* etf list */
  .etf-list{display:flex; flex-direction:column; gap:0;}
  .etf-row{
    display:grid; grid-template-columns:1.4fr 2fr 0.6fr; gap:18px; align-items:center;
    padding:16px 0; border-bottom:1px solid var(--line);
  }
  .etf-row:first-child{border-top:1px solid var(--line);}
  .etf-fund{font-size:13.5px;}
  .etf-fund .code{color:var(--text-faint); font-size:12px;}
  .etf-holding{font-size:13px; color:var(--text-muted);}
  .bar-track{height:5px; background:var(--panel-2); border-radius:3px; margin-top:7px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--brass);}
  .etf-delta{text-align:right; font-size:13.5px;}

  /* cb table */
  table.cb{width:100%; border-collapse:collapse; font-size:14px;}
  table.cb th{
    text-align:left; font-weight:500; color:var(--text-faint); font-size:12px;
    padding:0 14px 12px; border-bottom:1px solid var(--line-strong);
  }
  table.cb td{padding:16px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .progress-cell{display:flex; align-items:center; gap:10px;}
  .progress-track{flex:1; height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--brass-dim), var(--brass));}
  .progress-pct{font-size:12px; color:var(--text-muted); width:34px; text-align:right;}

  /* quant cards */
  .quant-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:1px; background:var(--line);}
  .quant-card{background:var(--ink); padding:26px 24px;}
  section.feature.alt .quant-card{background:var(--panel);}
  .quant-card h3{font-size:17px; margin-bottom:8px;}
  .quant-card p{font-size:13.5px; color:var(--text-muted); margin:0 0 16px; max-width:30em;}
  .quant-stats{display:flex; gap:22px; margin-top:14px; font-size:12.5px;}
  .quant-stats div span{display:block; color:var(--text-faint); margin-bottom:3px; font-size:11.5px;}
  .quant-stats div b{font-size:14px;}
  .spark{display:block; margin-top:4px;}

  /* cta band */
  .cta-band{
    padding:80px 0; text-align:center; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .cta-band h2{font-size:26px; max-width:14em; margin:0 auto;}
  .cta-band p{color:var(--text-muted); margin:16px auto 28px; max-width:32em; font-size:14.5px;}

  footer.site{padding:44px 0 56px;}
  .foot-row{
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:20px;
  }
  .foot-note{font-size:12.5px; color:var(--text-faint); max-width:34em; line-height:1.7;}
  .foot-links{display:flex; gap:22px; font-size:13px;}
  .foot-links a{text-decoration:none; color:var(--text-muted);}
  .foot-links a:hover{color:var(--brass);}

  @media (max-width: 860px){
    .nav-row{padding:14px 20px;}
    .nav-row{flex-wrap:wrap; row-gap:10px;}
    nav.links{display:flex; order:3; width:100%; gap:20px; overflow-x:auto; white-space:nowrap; font-size:13.5px; padding-bottom:2px; scrollbar-width:none;}
    nav.links::-webkit-scrollbar{display:none;}
    .hero{padding:52px 0 0;}
    .hero-grid{grid-template-columns:1fr; gap:34px;}
    .hero h1{font-size:32px;}
    section.feature{padding:64px 0;}
    .feature-head{grid-template-columns:1fr; gap:14px;}
    .feature-head .desc{align-self:auto;}
    .quant-grid{grid-template-columns:1fr;}
    .etf-row{grid-template-columns:1fr; row-gap:8px;}
    .etf-delta{text-align:left;}
    table.chips, table.cb{font-size:12.5px;}
    .wrap{padding:0 18px;}
  }

  /* ---------- 首頁（暫時版） ---------- */
  .home{padding:88px 0 40px;}
  .home .eyebrow{font-size:13px; color:var(--brass); margin-bottom:10px;}
  .home h1{font-size:36px;}
  .home .lede{color:var(--text-muted); font-size:15px; margin:14px 0 32px;}
  .home h1{margin-bottom:4px;}
  .quick{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
    border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;}
  .quick a{background:var(--panel); padding:22px 22px 24px; text-decoration:none; transition:background .15s ease;}
  .quick a:hover{background:var(--panel-2);}
  .quick a:hover b{color:var(--brass);}
  .quick b{display:block; font-family:'Noto Serif TC',serif; font-size:17px; margin-bottom:6px;}
  .quick span{font-size:13px; color:var(--text-muted); line-height:1.6;}

  .block{margin-top:36px;}
  .block-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line-strong); padding-bottom:10px; margin-bottom:6px;}
  .block-head h2{font-size:20px;}
  .block-head a{font-size:13px; color:var(--text-muted); text-decoration:none;}
  .block-head a:hover{color:var(--brass);}
  .block-note{font-size:12.5px; color:var(--text-faint); margin:8px 0 4px;}
  .wk-item{display:grid; grid-template-columns:150px minmax(0,1fr); gap:18px; padding:16px 0; border-bottom:1px solid var(--line);}
  .wk-date b{display:block; font-family:'IBM Plex Mono',monospace; font-size:15px;}
  .wk-date span{display:block; font-size:12px; color:var(--text-faint); margin-top:2px;}
  .wk-date .tag{display:inline-block; margin-top:6px; font-size:11.5px; padding:1px 7px; border-radius:2px; border:1px solid var(--line-strong); color:var(--text-muted);}
  .wk-date .tag.done{border-color:var(--brass-dim); color:var(--brass);}
  .wk-date .tag.today{background:var(--brass); color:var(--ink); border-color:var(--brass);}
  .wk-idx{font-size:14.5px;}
  .wk-prov{font-size:10.5px; border:1px solid var(--line-strong); color:var(--text-faint); border-radius:2px; padding:0 5px; margin-right:8px; vertical-align:2px;}
  .wk-etfs{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .wk-etfs a{border:1px solid var(--line-strong); border-radius:3px; padding:2px 8px; font-size:12.5px; color:var(--text-muted); text-decoration:none;}
  .wk-etfs a:hover{border-color:var(--brass); color:var(--brass);}
  .wk-etfs b{font-family:'IBM Plex Mono',monospace; font-weight:500; color:var(--text); margin-right:6px;}
  .wk-res{margin-top:10px; font-size:13px; line-height:1.9;}
  .wk-res .lbl{display:inline-block; min-width:48px; font-size:12px;}
  .wk-res .add{color:var(--rise);} .wk-res .del{color:var(--fall);}
  .wk-res .stk{color:var(--text-muted); margin-right:10px; white-space:nowrap;}
  .wk-res .stk b{font-family:'IBM Plex Mono',monospace; font-weight:500; color:var(--text); margin-right:4px;}
  .wk-res .muted, .wk-empty{color:var(--text-faint);}
  .wk-empty{padding:22px 0; font-size:14px;}
  @media (max-width: 860px){ .wk-item{grid-template-columns:1fr; gap:6px;} }
  @media (max-width: 860px){
    .home{padding:48px 0 24px;}
    .home h1{font-size:28px;}
    .quick{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="nav-row">
    <div class="brand">
      <span class="brand-mark">潮汐</span>
      <span class="brand-sub">籌碼觀測站</span>
    </div>
    <nav class="links">
      <a href="index.html" aria-current="page">首頁</a>
      <a href="ranking.html">成交排行</a>
      <a href="broker.html">分點籌碼</a>
      <a href="etf.html">ETF持股</a>
      <a href="#cb">CB詢圈</a>
      <a href="#quant">量化策略</a>
      <a href="health.html">資料健檢</a>
    </nav>
    <a href="#cta" class="nav-cta">開始追蹤</a>
  </div>
</header>

<main>
  <section class="home">
    <div class="wrap">
      <div class="eyebrow">潮汐 · 籌碼觀測站</div>
      <h1>今天要先看的重點</h1>

      <div class="block">
        <div class="block-head">
          <h2>未來一週 ETF 指數調整</h2>
          <a href="etf.html#calendar">完整行事曆 →</a>
        </div>
        <p class="block-note" id="weekNote">載入中…</p>
        <div id="weekList"></div>
      </div>

      <div class="block-head" style="margin-top:56px"><h2>資料頁</h2></div>
      <div class="quick">
        <a href="ranking.html"><b>成交排行</b><span>當日成交金額排行、市場資金集中度</span></a>
        <a href="broker.html"><b>分點籌碼</b><span>全市場前 15 大分點、重點分點加總排行</span></a>
        <a href="etf.html"><b>ETF持股</b><span>個股被哪些 ETF 持有、每日持股變化、AUM 排行、指數調整行事曆</span></a>
        <a href="health.html"><b>資料健檢</b><span>每天的資料是否都有正確抓到</span></a>
      </div>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <div class="foot-row">
      <p class="foot-note">資料每個交易日收盤後自動更新，各頁標示資料來源與日期。本網站資訊僅供參考，不構成任何投資建議。</p>
      <div class="foot-links">
        <a href="ranking.html">成交排行</a>
        <a href="broker.html">分點籌碼</a>
        <a href="etf.html">ETF持股</a>
        <a href="health.html">資料健檢</a>
      </div>
    </div>
  </div>
</footer>

<script>(function(){var a=document.querySelector('nav.links a[aria-current="page"]');if(a&&a.parentNode.scrollWidth>a.parentNode.clientWidth){a.parentNode.scrollLeft=a.offsetLeft-a.parentNode.offsetLeft-16;}})();</script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const plus = n => new Date(Date.parse(today + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);
  const end = plus(7);
  const wk = d => "日一二三四五六"[new Date(d + "T00:00:00+08:00").getDay()];
  const md = d => d.slice(5).replace("-", "/");
  const short = s => s.replace(/^臺灣指數公司/, "");
  try {
    const r = await fetch("data/etf/tip.json", { cache: "no-cache" });
    const d = await r.json();
    const rows = d.rows.map(x => Object.fromEntries(d.cols.map((c, i) => [c, x[i]])))
      // 未來一週要公告的，加上已公告但還沒生效的；只列有 ETF 追蹤的指數
      .filter(x => x.etfs.length && x.ann <= end && (x.ann >= today || (x.eff && x.eff >= today)))
      .sort((a, b) => a.ann.localeCompare(b.ann) || a.index.localeCompare(b.index));
    const nEtf = new Set(rows.flatMap(x => x.etfs)).size;
    $("weekNote").textContent = `${md(today)} ～ ${md(end)}：${rows.length} 個指數、${nEtf} 檔 ETF。公告後（收盤後）列出成分股納入／刪除名單，生效前一個交易日收盤 ETF 通常會調整持股。`;
    const stk = xs => xs.map(([c, n, en]) => `<span class="stk"${en ? ` title="${esc(en)}"` : ""}><b>${esc(c || "—")}</b>${esc(n)}</span>`).join("");
    $("weekList").innerHTML = rows.length ? rows.map(x => {
      const announced = x.add || x.del;
      const tag = announced ? '<span class="tag done">已公告</span>' : x.ann === today ? '<span class="tag today">今天收盤後公告</span>' : '<span class="tag">待公告</span>';
      const res = !announced ? "" : (!x.add.length && !x.del.length) ? '<div class="wk-res muted">成分股無異動</div>' :
        `<div class="wk-res"><div><span class="lbl add">納入 ${x.add.length}</span>${x.add.length ? stk(x.add) : '<span class="muted">無</span>'}</div>
         <div><span class="lbl del">刪除 ${x.del.length}</span>${x.del.length ? stk(x.del) : '<span class="muted">無</span>'}</div></div>`;
      return `<div class="wk-item">
        <div class="wk-date"><b>${md(x.ann)}（${wk(x.ann)}）</b><span>${x.eff ? `生效 ${md(x.eff)}（${wk(x.eff)}）` : ""}</span>${tag}</div>
        <div><div class="wk-idx">${x.prov === "MSCI" ? '<span class="wk-prov">MSCI</span>' : x.prov === "FTSE" ? '<span class="wk-prov">富時</span>' : ""}${esc(short(x.index))}</div>
          <div class="wk-etfs">${x.etfs.map(c => `<a href="etf.html?q=${encodeURIComponent(c)}#changes"><b>${esc(c)}</b>${esc(d.etfs[c] || "")}</a>`).join("")}</div>
          ${res}</div>
      </div>`;
    }).join("") : '<p class="wk-empty">未來一週沒有 ETF 追蹤的指數要調整。</p>';
  } catch (e) {
    console.error(e);
    $("weekNote").textContent = "讀取行事曆失敗，請重新整理頁面。";
  }
})();
</script>
</body>
</html>
