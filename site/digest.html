<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101419">
<title>盤後摘要｜潮汐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101419; --panel:#171C22; --panel-2:#1E242B;
    --line:rgba(232,237,242,0.09); --line-strong:rgba(232,237,242,0.16);
    --text:#E8EDF2; --text-muted:#A9B2BC; --text-faint:#8B95A0;
    --brass:#C6A15B; --rise:#E1594F; --fall:#3FAE72; --warn:#D9A441;
    --radius-s:3px; --radius-m:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:var(--text);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Noto Sans TC',sans-serif; margin:0; font-weight:700;}
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 28px;}
  header.site{position:sticky; top:0; z-index:40; background:#101419; border-bottom:1px solid var(--line);}
  .nav-row{display:flex; align-items:center; justify-content:space-between; padding:16px 28px;}
  .brand{display:flex; align-items:baseline; gap:10px; text-decoration:none;}
  .brand-mark{font-family:'Noto Sans TC',sans-serif; font-size:22px; font-weight:700;}
  .brand-sub{font-size:12px; color:var(--text-faint);}
  .page-head{padding:56px 0 20px;}
  h1{font-size:32px;}
  .desc{color:var(--text-muted); font-size:14.5px; margin:12px 0 0; max-width:46em;}
  .bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:8px 0 24px;}
  .bar select, .bar button{background:var(--panel); border:1px solid var(--line-strong); color:var(--text); padding:6px 10px; border-radius:var(--radius-s); font:inherit; font-size:13.5px; cursor:pointer;}
  .bar button:disabled{opacity:.4; cursor:default;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m); padding:6px 24px 18px; margin-bottom:28px;}
  .card.empty{color:var(--text-faint); font-size:14px; padding:18px 24px;}
  .md h1{display:none;}
  .md h2{font-size:18px; margin:28px 0 10px;}
  .card .md h2:first-of-type{margin-top:18px;}
  .md p, .md li{font-size:14.5px; color:var(--text); line-height:1.85;}
  .md ul, .md ol{padding-left:1.3em; margin:6px 0;}
  .md strong{color:var(--text); font-weight:700;}
  .md a{color:var(--text-muted);}
  .md .tbl{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-m); margin:8px 0 6px;}
  .md table{width:100%; border-collapse:collapse; font-size:13px;}
  .md th, .md td{padding:7px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .md th{font-weight:500; color:var(--text-muted); font-size:12.5px; background:var(--panel);}
  .md td:first-child, .md th:first-child, .md td.t, .md th.t{text-align:left;}
  .md tr:last-child td{border-bottom:none;}
  .faint{color:var(--text-faint);}
  .up{color:var(--rise);} .dn{color:var(--fall);}
  .sec-t{font-size:13px; color:var(--text-faint); margin:0 0 6px;}
  .note{font-size:12.5px; color:var(--text-faint); margin-top:18px; line-height:1.8;}
  footer.site{padding:48px 0; margin-top:64px; border-top:1px solid var(--line);}
  @media (max-width:860px){
    .nav-row{padding:14px 16px; flex-wrap:wrap; row-gap:10px;}
    .wrap{padding:0 16px;} h1{font-size:26px;}
    .card{padding:4px 14px 14px;}
    .md th, .md td{padding:6px 8px;}
  }
</style>
</head>
<body>
<header class="site">
  <div class="nav-row">
    <a href="index.html" class="brand"><span class="brand-mark">潮汐</span><span class="brand-sub">籌碼觀測站</span></a>
    <nav class="gnav"></nav>
  </div>
</header>
<script src="nav.js"></script>
<main class="wrap">
  <section class="page-head">
    <h1>盤後摘要</h1>
    <p class="desc">每個交易日晚上整理大盤位置、法人與期權籌碼、融資、族群強弱，加上一段研究員角度的判讀。資料分析，不是投資建議。</p>
  </section>
  <div class="bar">
    <button id="prev" aria-label="前一天">‹</button>
    <select id="day" aria-label="日期"></select>
    <button id="next" aria-label="後一天">›</button>
  </div>
  <p class="sec-t">判讀</p>
  <div class="card" id="note"><div class="md"><p class="faint">載入中…</p></div></div>
  <p class="sec-t">數字</p>
  <div class="md" id="num"></div>
  <p class="note">買賣超金額為股數×收盤價估算，含 ETF。族群報酬取成分股中位數；產業鏈分類來自產業價值鏈平台。數字在晚上法人與融資資料進來後自動產生，判讀約 23:00 前後補上。</p>
</main>
<footer class="site"><div class="wrap"><p class="note" style="margin:0">本頁於每次網站重建時產生。</p></div></footer>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inl = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
const cell = s => {
  const t = s.trim(), h = inl(t);
  if (/^[+-][\d,.]+%?$/.test(t) && !/^[+-]0(\.0)?%?$/.test(t)) return `<td class="${t[0] === "+" ? "up" : "dn"}">${h}</td>`;
  return /^[\d,.+-]+%?$/.test(t) || t === "—" ? `<td>${h}</td>` : `<td class="t">${h}</td>`;
};
function md(src){
  const L = src.split("\n"), out = [];
  let i = 0;
  while (i < L.length){
    const l = L[i];
    if (/^#{1,3} /.test(l)){ const n = l.match(/^#+/)[0].length; out.push(`<h${n}>${inl(l.slice(n+1))}</h${n}>`); i++; continue; }
    if (/^\|/.test(l)){
      const rows = []; while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const sp = r => r.replace(/^\||\|$/g, "").split("|");
      const body = rows.slice(2).map(r => "<tr>" + sp(r).map(cell).join("") + "</tr>").join("");
      out.push(`<div class="tbl"><table><thead><tr>${sp(rows[0]).map((c, k) => `<th${k ? "" : ' class="t"'}>${inl(c.trim())}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`);
      continue;
    }
    if (/^\s*([-*]|\d+\.) /.test(l)){
      const ol = /^\s*\d+\./.test(l), it = [];
      while (i < L.length && /^\s*([-*]|\d+\.) /.test(L[i])) it.push(L[i++].replace(/^\s*([-*]|\d+\.) /, ""));
      out.push(`<${ol ? "ol" : "ul"}>${it.map(x => `<li>${inl(x)}</li>`).join("")}</${ol ? "ol" : "ul"}>`);
      continue;
    }
    if (!l.trim()){ i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#|\||\s*([-*]|\d+\.) )/.test(L[i])) p.push(L[i++]);
    out.push(`<p>${inl(p.join(" "))}</p>`);
  }
  return out.join("");
}
let days = [];
const sel = document.getElementById("day");
const fmt = d => `${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6)}`;
async function show(d){
  const k = days.findIndex(x => x.date === d);
  sel.value = d;
  document.getElementById("prev").disabled = k >= days.length - 1;
  document.getElementById("next").disabled = k <= 0;
  try { history.replaceState(null, "", "#" + d); } catch (e) {}
  const get = u => fetch(u, {cache:"no-cache"}).then(r => r.ok ? r.text() : null).catch(() => null);
  const [num, note] = await Promise.all([get(`data/digest/${d}.md`), days[k].note ? get(`data/digest/notes/${d}.md`) : null]);
  document.getElementById("num").innerHTML = num ? md(num) : '<p class="faint">數字摘要載入失敗</p>';
  const n = document.getElementById("note");
  n.className = note ? "card" : "card empty";
  n.innerHTML = note ? `<div class="md">${md(note)}</div>` : "這天還沒有判讀。";
}
sel.onchange = () => show(sel.value);
document.getElementById("prev").onclick = () => { const k = days.findIndex(x => x.date === sel.value); if (k < days.length - 1) show(days[k+1].date); };
document.getElementById("next").onclick = () => { const k = days.findIndex(x => x.date === sel.value); if (k > 0) show(days[k-1].date); };
fetch("data/digest/index.json", {cache:"no-cache"}).then(r => r.json()).then(j => {
  days = j.dates;
  if (!days.length){ document.getElementById("note").innerHTML = "還沒有摘要。"; return; }
  sel.innerHTML = days.map(x => `<option value="${x.date}">${fmt(x.date)}${x.note ? "" : "（只有數字）"}</option>`).join("");
  const h = location.hash.slice(1);
  show(days.some(x => x.date === h) ? h : days[0].date);
}).catch(() => { document.getElementById("note").innerHTML = "摘要載入失敗"; });
</script>
</body>
</html>
