<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101419">
<title>結算日套利｜潮汐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101419; --panel:#171C22; --panel-2:#1E242B;
    --line:rgba(232,237,242,0.09); --line-strong:rgba(232,237,242,0.16);
    --text:#E8EDF2; --text-muted:#A9B2BC; --text-faint:#8B95A0;
    --brass:#C6A15B; --brass-soft:rgba(198,161,91,0.14); --rise:#E1594F; --fall:#3FAE72;
    --radius-s:3px; --radius-m:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:var(--text);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Noto Sans TC',sans-serif; margin:0; font-weight:700;}
  h2{font-size:20px;}
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 28px;}
  header.site{position:sticky; top:0; z-index:40; background:#101419; border-bottom:1px solid var(--line);}
  .nav-row{display:flex; align-items:center; justify-content:space-between; padding:16px 28px;}
  .brand{display:flex; align-items:baseline; gap:10px; text-decoration:none;}
  .brand-mark{font-family:'Noto Sans TC',sans-serif; font-size:22px; font-weight:700;}
  .brand-sub{font-size:12px; color:var(--text-faint);}
  .page-head{padding:56px 0 8px;}
  h1{font-size:32px;}
  .desc{color:var(--text-muted); font-size:14.5px; margin:12px 0 0; max-width:52em;}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; margin-top:28px;}
  .stat{background:var(--panel); padding:16px 20px;}
  .stat .k{font-size:12.5px; color:var(--text-muted);}
  .stat .v{font-size:26px; margin-top:2px;}
  .stat .s{font-size:12px; color:var(--text-faint);}
  section.block{margin-top:48px;}
  .block-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:14px; flex-wrap:wrap;}
  .hint{font-size:12.5px; color:var(--text-faint);}
  .up{color:var(--rise);} .down{color:var(--fall);} .flat{color:var(--text-muted);}
  [hidden]{display:none !important;}
  .lots{font-size:11px; color:var(--text-faint); white-space:nowrap; font-weight:400; font-family:'Noto Sans TC',sans-serif;}
  @media (max-width:600px){ .lots{display:none;} }
  .faint{color:var(--text-faint);} .muted{color:var(--text-muted);}

  .tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-m);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th, td{padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;}
  th{font-size:12px; color:var(--text-muted); font-weight:500; background:var(--panel); position:sticky; top:0;}
  td.n, th.n{text-align:right;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.click{cursor:pointer;}
  tbody tr.click:hover td{background:var(--panel);}
  tbody tr.on td{background:var(--brass-soft);}
  th[data-k]{cursor:pointer; user-select:none;} th[data-k]:hover{color:var(--text);} th.sorted{color:var(--text);}
  .sname{font-weight:500;}
  .sname a{text-decoration:none;} .sname a:hover{color:var(--text);}
  .sname .mono{font-size:11.5px; color:var(--text-faint); margin-left:6px; font-weight:500;}
  .tag{display:inline-block; font-size:11px; padding:0 5px; border-radius:var(--radius-s); border:1px solid var(--line-strong); color:var(--text-muted); margin-left:6px;}
  .tag.ath{border-color:var(--rise); color:var(--rise);}
  .star{color:var(--brass); margin-left:4px; font-size:12px;}
  .gpath{display:block; font-size:11.5px; color:var(--text-faint);}
  .show-s{display:none;}
  .leaders{white-space:normal; min-width:14em; font-size:12.5px; color:var(--text-muted);}
  .bar{display:inline-block; width:64px; height:6px; background:var(--line); border-radius:2px; vertical-align:middle; margin-right:8px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--rise);}
  .dots{display:inline-flex; gap:2px; vertical-align:middle;}
  .dots i{display:block; width:5px; height:12px; border-radius:1px; background:var(--line);}
  .dots i.h{background:var(--rise);} .dots i.a{background:var(--rise); box-shadow:inset 0 -4px 0 var(--brass);}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; margin-top:28px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chips button{background:none; border:1px solid var(--line-strong); color:var(--text-muted); padding:5px 11px; border-radius:var(--radius-s); cursor:pointer; font:inherit; font-size:13px;}
  .chips button[aria-pressed="true"]{border-color:var(--text-faint); color:var(--text);}
  .chk-in{font-size:13px; color:var(--text-muted); display:flex; align-items:center; gap:6px;}
  .filter{background:var(--panel); border:1px solid var(--line-strong); color:var(--text); padding:6px 11px; border-radius:var(--radius-s); font:inherit; font-size:13px; width:12em;}
  .filter:focus{outline:none; border-color:var(--text-faint);}
  .pick{display:inline-flex; align-items:center; gap:8px; font-size:13px; background:var(--brass-soft); color:var(--text); padding:4px 10px; border-radius:var(--radius-s);}
  .pick button{background:none; border:none; color:var(--text-muted); cursor:pointer; font:inherit; padding:0;}
  .more{display:block; margin:14px auto 0; background:none; border:1px solid var(--line-strong); color:var(--text-muted); padding:7px 18px; border-radius:var(--radius-s); cursor:pointer; font:inherit; font-size:13px;}
  .more:hover{color:var(--text); border-color:var(--text-faint);}
  .empty{padding:20px 12px; color:var(--text-faint); font-size:13.5px;}
  .note{font-size:12.5px; color:var(--text-faint); margin-top:18px; line-height:1.8;}

  .chart{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px 6px;}
  .chart svg{display:block; width:100%; height:180px;}
  .chart .axis{font-size:10.5px; fill:var(--text-faint); font-family:'IBM Plex Mono',monospace;}
  .legend{display:flex; gap:16px; font-size:12px; color:var(--text-muted); margin-bottom:6px; flex-wrap:wrap;}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px;}
  .tip{position:absolute; pointer-events:none; background:var(--ink); border:1px solid var(--line-strong); border-radius:var(--radius-s); padding:8px 10px; font-size:12px; min-width:130px; box-shadow:0 4px 16px rgba(0,0,0,.4); display:none; z-index:5;}
  .tip .d{color:var(--text-muted); margin-bottom:4px;}
  .tip .r{display:flex; gap:12px; justify-content:space-between; white-space:nowrap;}
  .tip .r b{font-weight:500; font-family:'IBM Plex Mono',monospace;}
  footer.site{padding:48px 0; margin-top:64px; border-top:1px solid var(--line);}
  @media (max-width:860px){
    .nav-row{padding:14px 16px; flex-wrap:wrap; row-gap:10px;}
    .wrap{padding:0 16px;}
    .stats{grid-template-columns:repeat(2,1fr);} h1{font-size:26px;}
    .hide-s{display:none;}
    .chart svg{height:150px;}
    .show-s{display:block;}
  }
  select.filter{width:auto;}
  .tabs{display:flex; gap:0; border-bottom:1px solid var(--line); margin-top:36px;}
  .tabs{overflow-x:auto; scrollbar-width:none;}
  .tabs button{white-space:nowrap; background:none; border:none; border-bottom:2px solid transparent; color:var(--text-muted); padding:10px 16px; cursor:pointer; font:inherit; font-size:15px;}
  .tabs button[aria-pressed="true"]{color:var(--text); border-bottom-color:var(--brass);}
  tr.sub-row td{background:var(--panel-2); font-size:12.5px; color:var(--text-muted);}
  .warn{color:var(--brass);}
  @media (max-width:860px){ th, td{padding:8px 8px;} .tabs button{padding:9px 10px; font-size:14px;} }
</style>
</head>
<body>
<header class="site">
  <div class="nav-row">
    <a href="index.html" class="brand"><span class="brand-mark">潮汐</span><span class="brand-sub">籌碼觀測站</span></a>
    <nav class="gnav"></nav>
  </div>
</header>
<script src="nav.js"></script>
<main class="wrap">
  <section class="page-head">
    <h1>結算日套利：尾盤誰會被砍</h1>
    <p class="desc" id="sub">載入中…</p>
    <nav class="ptabs"></nav>
    <div class="stats" id="stats"></div>
  </section>


  <section class="block" style="margin-top:20px">
    <div class="toolbar" style="margin:0 0 12px">
      <div id="liq"></div>
      <div class="chips" id="revd">
        <button data-d="all" aria-pressed="true">多空都看</button><button data-d="S" aria-pressed="false">只看空方</button><button data-d="L" aria-pressed="false">只看多方</button>
      </div>
      <div class="chips" id="revf">
        <button data-n="3" aria-pressed="false">3 項全中</button><button data-n="2" aria-pressed="true">中 2 項以上</button><button data-n="0" aria-pressed="false">全部</button>
      </div>
      <label class="chk-in" id="thr-l">倍數門檻 <select class="filter" id="thr"><option value="0.5">≥ 0.5×</option><option value="1" selected>≥ 1×</option><option value="2">≥ 2×</option><option value="3">≥ 3×</option></select></label>
      <label class="chk-in"><input type="checkbox" id="noetf" checked> 排除 ETF</label>
      <label class="chk-in" id="both-l"><input type="checkbox" id="both"> 只看像套利</label>
      <label class="chk-in"><input type="checkbox" id="mine"> 只看自選</label>
      <input class="filter" id="q" type="search" placeholder="代號或名稱" autocomplete="off" aria-label="搜尋">
    </div>
    <p class="hint" id="hint" style="margin:0 0 10px"></p>
    <div class="tbl-wrap"><table>
      <thead id="head"></thead>
      <tbody id="body"></tbody>
    </table></div>
    <button class="more" id="more" hidden>顯示更多</button>
    <p class="note" id="note"></p>
  </section>
</main>
<footer class="site"><div class="wrap"><p class="note" style="margin:0">資料僅供參考，不構成投資建議。</p></div></footer>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v, d = 2) => v == null ? "–" : (+v).toLocaleString("zh-TW", {maximumFractionDigits: d});
const int = v => v == null ? "–" : Math.round(v).toLocaleString("zh-TW");
const sint = v => v == null ? "–" : (v > 0 ? "+" : "") + Math.round(v).toLocaleString("zh-TW");
const cls = v => v == null ? "faint" : v > 0 ? "up" : v < 0 ? "down" : "flat";
const pct = (v, d = 2) => `<span class="${cls(v)}">${v == null ? "–" : `${v > 0 ? "+" : ""}${(+v).toFixed(d)}%`}</span>`;
const obj = (cols, rows) => rows.map(r => Object.fromEntries(cols.map((k, i) => [k, r[i]])));
/* 特法口數明細：一般／小型分開，口數 × 每口張數 */
const kname = x => x[1] < 1000 ? "小型" : "一般";
const ztz = sz => (sz / 1000).toLocaleString("zh-TW", {maximumFractionDigits: 3});
/* L：false＝特法空單、true＝特法多單、"oi"＝全市場未平倉 */
const kv = (x, L) => L === "oi" ? x[4] : L ? x[3] : x[2];
const kt = (r, L) => L === "oi" ? r.oi : L ? r.l10 : r.s10;
const lots = (r, L) => (r.k || []).filter(x => kv(x, L) > 0).map(x => `${kname(x)} ${int(kv(x, L))} 口×${ztz(x[1])}`).join("＋") || "0 口";
const lotsLine = (r, L) => `${L === "oi" ? "市場總未平倉" : `特法${L ? "多" : "空"}單`}：${(r.k || []).map(x => `${kname(x)}（${esc(x[0])}，每口 ${ztz(x[1])} 張）${x[4] == null && L === "oi" ? "–" : int(kv(x, L))} 口`).join("＋")}＝<b>${int(kt(r, L))} 張</b>`;
const posCell = (r, L, cls = "") => `<td class="n mono${cls}" data-v="${kt(r, L)}">${int(kt(r, L))}<div class="lots">${lots(r, L)}</div></td>`;
const sname = r => `<span class="sname"><a href="stock.html#s=${encodeURIComponent(r.code)}">${esc(r.name)}</a><span class="mono">${esc(r.code)}</span></span>`;
const Watch = window.TideWatch || {list: () => []};
/* 倍數：≥0.5 標黃粗體、≥0.3 標黃 */
const mult = v => v == null ? "–" : v >= 0.5 ? `<b class="warn">${v.toFixed(2)}×</b>` : v >= 0.3 ? `<span class="warn">${v.toFixed(2)}×</span>` : v <= -0.3 ? `<span class="faint">${v.toFixed(2)}×</span>` : `${v.toFixed(2)}×`;
const sgn = v => v == null ? "–" : `<span class="${cls(v)}">${sint(v)}</span>`;
const md = d => d ? d.slice(5).replace("-", "/") : "–";

const S = { dir: "all", min: 2, thr: 1, noetf: true, both: false, mine: false, q: "", limit: 100, open: null};
let D, R = [];

/* 同向：空方＝特法淨空 + 自營商累積買超（現貨多、期貨空）；多方＝特法淨多 + 自營商累積賣超 */
/* 套利判定：這個結算週期裡，自營商買超（賣超）和特法加空（加多）的量，有幾成發生在正價差（逆價差）的日子 */
const share = (a, b) => b > 0 ? Math.round(a / b * 100) : null;
const arb = (r, L) => {
  const d = L ? share(r.d_sell_neg, r.d_sell) : share(r.d_buy_pos, r.d_buy);
  const f = L ? share(r.l_add_neg, r.l_add) : share(r.s_add_pos, r.s_add);
  const net = L ? r.nl_r > 0 : r.ns_r > 0;
  const hit = [d, f].filter(x => x != null && x >= 70).length, has = [d, f].filter(x => x != null).length;
  return {d, f, lv: !net || !has ? 0 : hit === has ? 2 : hit ? 1 : 0};
};
/* 可能反解（多方、空方分開列，同一檔可能兩邊都上榜）：① 特法空（多）單 ÷ 尾盤量 ≥ 門檻　② 自營商累積同向（空方＝買超、多方＝賣超）÷ 5 日量 ≥ 門檻
   ③ 今天有同向價差（空方正價差、多方逆價差），而且自營商同向買（賣）超張數加權有 ≥70% 在同向價差日＝跟套利有關
   空方＝特法空單、正價差套利、結算賣現貨；多方＝特法多單、逆價差套利、結算買回 */
/* 分母＝尾盤量：近 5 日「均」量（成交量 − 當沖）× 0.3（結算價取收盤前 60 分鐘，只有尾盤會反解）
   → 倍數 ＝ 部位 ÷ （5 日合計 ÷ 5 × 0.3）＝ 原本 ÷ 5 日合計 的倍數 × 5 ÷ 0.3 */
const TAIL = 0.3, TK = 5 / TAIL;
const rev = r => {
  const L = !!r._L, t = S.thr;
  const fr = (L ? r.l_r : r.s_r) * TK, dr = r.d_r == null ? null : (L ? -r.d_r : r.d_r) * TK;
  const net = L ? r.l10 : r.s10, dc = r.d_cum == null ? 0 : L ? -r.d_cum : r.d_cum;
  const a = arb(r, L);
  /* 自營商同向買（賣）超的日子，用張數加權，看有幾成落在同向價差日（大買賣超權重大） */
  let bw = 0, bp = 0, bn = 0;
  for (const [, bz, dn] of D.detail[r.code] || []) {
    const v = dn == null ? 0 : L ? -dn : dn;
    if (v <= 0 || bz == null) continue;
    bw += v; bn++; if (L ? bz < 0 : bz > 0) bp += v;
  }
  const bs = bw > 0 ? Math.round(bp / bw * 100) : null;
  const bOk = r.basis != null && (L ? r.basis < 0 : r.basis > 0);
  const c = [fr >= t, dr != null && dr >= t, bOk && dc > 0 && bs != null && bs >= 70];  /* 自營商累積方向要對，才算跟套利有關 */
  const q = Math.max(0, Math.min(net, dc));  /* 特法部位和自營商同向累積重疊的張數＝最可能是套利、結算要反解的量 */
  const tl = r.v5 ? r.v5 / 5 * TAIL : 0;
  return {L, fr, dr, a, bs, bn, bOk, c, n: c.filter(Boolean).length, q, qr: tl ? q / tl : 0, or: tl ? (r.oi || 0) / tl : 0};
};
const tm = v => v >= S.thr ? `<b class="warn">${v.toFixed(1)}×</b>` : v >= 1 ? `<span class="warn">${v.toFixed(1)}×</span>` : `${v.toFixed(1)}×`;
const ck = (ok, html) => ok ? `<span class="warn">✓</span> ${html}` : `<span class="faint">${html}</span>`;
const bz = v => v == null ? "–" : `<span class="${cls(v)}">${v > 0 ? "+" : ""}${v.toFixed(2)}%</span>`;

function stats(){
  const n = D.next_settle || {}, stk = R.filter(r => !r.etf);
  $("stats").innerHTML = [
    ["下次結算日", md(n.date), n.tdays != null ? `還有 ${n.tdays} 個交易日（${D.month} 合約）` : ""],
    ...(sp => [["可能反解（3 項全中）", `${sp.filter(r => rev(r).n === 3).length} 筆`, `空方 ${sp.filter(r => !r._L && rev(r).n === 3).length}・多方 ${sp.filter(r => r._L && rev(r).n === 3).length}；中 2 項以上 ${sp.filter(r => rev(r).n >= 2).length} 筆（門檻 ${S.thr}×，未套成交值濾網）`]])(split(stk)),
    ["特法空單 ÷ 5 日量 ≥ 0.3", `${stk.filter(r => r.s_r >= 0.3).length} 檔`, `≥ 0.5 有 ${stk.filter(r => r.s_r >= 0.5).length} 檔（未套成交值濾網）`],
    ["特法多單 ÷ 5 日量 ≥ 0.3", `${stk.filter(r => r.l_r >= 0.3).length} 檔`, `≥ 0.5 有 ${stk.filter(r => r.l_r >= 0.5).length} 檔（未套成交值濾網）`],
  ].map(([k, v, s]) => `<div class="stat"><div class="k">${k}</div><div class="v mono">${v}</div><div class="s">${s}</div></div>`).join("");
  $("sub").textContent = `${D.date} 收盤・股票期貨近月（${D.month}）十大特定法人部位，換算成現貨張數後和近 5 日成交量比。部位越大、量越小，結算日（收盤前 60 分鐘均價）套利平倉對尾盤的影響越大。`;
}

/* 可能反解分頁：每檔拆成空方、多方兩列 */
const split = rs => rs.flatMap(r => [{...r, _L: false, _k: r.code + ":S"}, {...r, _L: true, _k: r.code + ":L"}]);
function rowsFor(){
  const mine = new Set(Watch.list()), q = S.q.trim().toLowerCase();
  const k = r => { const x = rev(r); return -(x.n * 1e6 + x.or); };
  const ok = r => rev(r).c[2];
  return split(R).filter(r => S.dir === "all" || (S.dir === "L") === r._L).filter(r => (!S.noetf || !r.etf || q) && (q || TideLiq.pass(r.code)) && (!S.mine || mine.has(r.code)) && (q || rev(r).n >= S.min) && (!S.both || ok(r))
      && (!q || r.code.toLowerCase().includes(q) || r.name.toLowerCase().includes(q)))
    .sort((a, b) => k(a) - k(b));
}

function render(){
  document.querySelectorAll("#revd button").forEach(b => b.setAttribute("aria-pressed", b.dataset.d === S.dir));
  document.querySelectorAll("#revf button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.n === S.min));
  const rs = rowsFor();
  let head, row;
  {
    $("hint").innerHTML = `三個條件：<b>①</b> 十大特法空單（多方看多單）÷ 尾盤量 ≥ ${S.thr}×；<b>②</b> 自營商從上次結算（${md(D.last_settle)}）隔天累積的同向買賣超 ÷ 尾盤量 ≥ ${S.thr}×（空方看買超、多方看賣超）；<b>③</b> 今天（${md(D.date)}）有同向價差，自營商累積方向對，而且自營商同向買（賣）超用張數加權有 ≥70% 落在同向價差日。多方、空方分開列，不扣對向部位：空方＝特法空單、正價差套利、結算日賣現貨；多方＝特法多單、逆價差套利、結算日買回。同一檔兩邊都可能上榜。先排中幾項（在最後一欄），再排「總未平倉 ÷ 尾盤量」。<br><b>市場總未平倉</b>＝近月股期全市場未沖銷（一般＋小型，小字是口數 × 每口張數），是套利部位的總上限。<br><b>尾盤量</b>＝近 5 日均量（成交量 − 當沖）× 0.3：結算價取收盤前 60 分鐘均價，只有這段時間會反解，抓一天量的三成。1× 就是部位等於一個尾盤的量。<br><b>價差</b>：③ 看兩件事，最新一天（${md(D.date)}）的價差方向，以及週期內（${md(D.cycle_start)} 起）每天的價差，用自營商買（賣）超張數加權，大買賣超的日子權重大。點一列可看每天價差。`;
    head = `<tr><th>股票</th><th>方向</th>
      <th class="n" title="近月股票期貨全市場未沖銷口數（一般＋小型）換算現貨張數；小字是一般／小型各幾口 × 每口張數">市場總未平倉（張）</th>
      <th class="n" title="市場總未平倉 ÷ 尾盤量（近 5 日均量扣當沖 × 0.3）">總未平倉 ÷ 尾盤量</th>

      <th class="n" title="十大特法空單（多方看多單）÷ 尾盤量（近 5 日均量扣當沖 × 0.3）">① 特法部位 ÷ 尾盤量</th>
      <th class="n" title="自營商從上次結算隔天累積的買賣超，空方看買超、多方看賣超，÷ 尾盤量（近 5 日均量扣當沖 × 0.3）">② 自營商累積 ÷ 尾盤量</th>
      <th class="n" title="最新一天：（期貨收盤 − 現貨收盤）÷ 現貨收盤">③ 今天價差</th>
      <th class="n" title="自營商同向買（賣）超的日子，用張數加權，落在同向價差日的比例；括號是同向買（賣）超天數">③ 自營商在同向價差</th>
      <th class="n" title="十大特法空單（多方看多單），口數換算成現貨張數；下面小字是一般／小型股期各幾口 × 每口張數">特法部位（張）</th><th class="n">自營商累積</th>
      <th class="n" title="近 5 個交易日平均每天成交量，扣掉現股當沖">5 日均量</th>
      <th class="n" title="5 日均量 × 0.3：收盤前 60 分鐘大約的成交量">尾盤量</th>
      <th class="n">收盤</th><th class="n hide-s">漲跌</th><th class="n">中幾項</th></tr>`;
    row = r => { const x = rev(r);
      return `<tr class="click${S.open === r._k ? " on" : ""}" data-code="${esc(r._k)}"><td>${sname(r)}</td>
      <td>${x.L ? '<span class="down">多方・買回</span>' : '<span class="up">空方・賣壓</span>'}</td>
      ${posCell(r, "oi")}<td class="n mono" data-v="${x.or}">${tm(x.or)}</td>
      <td class="n mono" data-v="${x.fr}">${ck(x.c[0], `${x.fr.toFixed(1)}×`)}</td>
      <td class="n mono" data-v="${x.dr ?? ""}">${ck(x.c[1], x.dr == null ? "–" : `${x.dr.toFixed(1)}×`)}</td>
      <td class="n mono" data-v="${r.basis ?? ""}">${x.bOk ? bz(r.basis) : `<span class="faint">${r.basis == null ? "–" : (r.basis > 0 ? "+" : "") + r.basis.toFixed(2) + "%"}</span>`}</td>
      <td class="n mono" data-v="${x.bs ?? ""}">${ck(x.c[2], x.bs == null ? "–" : `${x.bs}%<span class="faint">（${x.bn} 天）</span>`)}</td>
      ${posCell(r, x.L)}<td class="n mono" data-v="${r.d_cum ?? ""}">${sgn(r.d_cum)}</td>
      <td class="n mono">${int(r.v5 / 5)}</td><td class="n mono">${int(r.v5 / 5 * TAIL)}</td>
      <td class="n mono">${num(r.close)}</td><td class="n mono hide-s" data-v="${r.chg ?? ""}">${pct(r.chg)}</td>
      <td class="n mono" data-v="${x.n}">${x.n === 3 ? `<b class="warn">3／3</b>` : `${x.n}／3`}</td></tr>` + detail(r, x.L); };
  }
  $("head").innerHTML = head;
  $("body").innerHTML = rs.slice(0, S.limit).map(row).join("") || `<tr><td colspan="17" class="empty">沒有符合條件的股票</td></tr>`;
  $("more").hidden = rs.length <= S.limit;
  $("note").innerHTML = `<b>十大特法</b>：期交所「期貨大額交易人未沖銷部位」裡，近月合約前十大交易人中屬於特定法人（自營商、外資、投信等）的多／空單。
    同一檔的一般股期（每口 2,000 股）、小型股期（每口 100 股）合併；ETF 期貨依契約股數。全部換算成現貨張數（表格大字是張數，下面小字是各契約口數 × 每口張數，例如「一般 225 口×2＋小型 3,279 口×0.1」＝778 張；點一列看完整算式）。除權息後的調整型契約（代號後面多個 1）期交所已併在一起，但每口股數不同，這裡用標準股數換算，會有小誤差。
    <b>÷ 5 日量</b>＝部位張數 ÷ 近 5 個交易日成交量合計（扣現股當沖，${D.v5_days.map(md).join("、")}）。<span class="warn">≥0.3 標黃、≥0.5 粗體</span>：結算時要平的現貨約當近一週真實換手的三成、一半以上。
    <b>週期增減</b>：近月特法部位從 ${md(D.base_day)} 到現在的變化，正數＝結算前還在建倉。
    <b>自營商累積</b>：上次結算日（${md(D.last_settle)}）隔天起累加的自營商買賣超（自行＋避險合計，拆不出套利部位）。
    <b>價差</b>＝（股期近月收盤 − 現貨收盤）÷ 現貨收盤；期貨收 13:45、現貨收 13:30，尾盤後大漲大跌的日子會失真，除權息前的逆價差多半是股利。
    <b>套利判定</b>：正價差套利是「買現貨＋空期貨」，所以自營商買超、特法加空的日子應該是正價差；逆價差套利相反。
    「自營商買在正價差」＝這個週期自營商買超張數中，發生在正價差日的比例；「特法加空在正價差」同理。<span class="warn">≥70% 標黃</span>；
    淨部位方向對、且有資料的兩項都 ≥70% 標「像套利」，只有一項標「部分」。點一列可看每天的價差和買賣超。
    限制：特定法人不只有套利，也有避險、投機；股期最後結算價是收盤前 60 分鐘均價，套利平倉常分散在 12:30～13:30，不一定只壓最後一盤。表格只排目前顯示的列。`;
}

/* 點一列展開：週期內每天的價差、自營商買賣超、特法多空增減 */
function detail(r, L = false){
  if (S.open !== (r._k || r.code)) return "";
  const rows = (D.detail[r.code] || []).map(x => Object.fromEntries(D.dcols.map((k, i) => [k, x[i]])));
  const hl = x => x.basis == null || L == null ? "" : (L ? x.basis < 0 : x.basis > 0) ? "" : ' style="opacity:.55"';
  return `<tr class="sub-row"><td colspan="17" style="padding:10px 12px">
    <div style="position:sticky; left:12px; display:inline-block; max-width:calc(100vw - 72px); white-space:normal">
    <div style="margin-bottom:2px">${lotsLine(r, "oi")}</div><div style="margin-bottom:2px">${lotsLine(r, false)}</div><div style="margin-bottom:6px">${lotsLine(r, true)}</div>
    <div class="faint" style="margin-bottom:4px">${esc(r.name)}：這個結算週期每天（張）。${L == null ? "" : `${L ? "逆" : "正"}價差的日子正常顯示，其他日子變淡`}</div>
    <table data-nosort style="width:auto; font-size:12.5px"><thead><tr><th>日期</th><th class="n">價差</th><th class="n">自營商買賣超</th><th class="n">特法空單增減</th><th class="n">特法多單增減</th></tr></thead>
    <tbody>${rows.map(x => `<tr${hl(x)}><td class="mono">${md(x.date)}</td><td class="n mono">${bz(x.basis)}</td><td class="n mono">${sgn(x.d_net)}</td><td class="n mono">${sgn(x.s_chg)}</td><td class="n mono">${sgn(x.l_chg)}</td></tr>`).join("")}</tbody></table>
    </div></td></tr>`;
}

async function init(){
  D = await fetch("data/settle.json").then(r => r.json()).catch(() => null);
  if (!D) { $("sub").textContent = "資料載入失敗"; return; }
  R = obj(D.cols, D.rows);
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("s")) { S.q = h.get("s"); $("q").value = S.q; }
  stats(); render();
  $("revd").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.dir = b.dataset.d; S.limit = 100; render(); };
  $("revf").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.min = +b.dataset.n; S.limit = 100; render(); };
  $("thr").onchange = e => { S.thr = +e.target.value; S.limit = 100; stats(); render(); };
  $("noetf").onchange = e => { S.noetf = e.target.checked; render(); };
  TideLiq.mount("liq", () => { S.limit = 100; render(); });
  $("both").onchange = e => { S.both = e.target.checked; render(); };
  $("mine").onchange = e => { S.mine = e.target.checked; render(); };
  $("q").oninput = e => { S.q = e.target.value; S.limit = 100; render(); };
  $("more").onclick = () => { S.limit += 200; render(); };
  $("body").onclick = e => { const tr = e.target.closest("tr.click"); if (!tr || e.target.closest("a")) return; S.open = S.open === tr.dataset.code ? null : tr.dataset.code; render(); };
}
init();
</script>
</body>
</html>
