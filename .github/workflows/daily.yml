name: Fetch daily stock prices

on:
  schedule:
    # 週一至週五 台北時間 15:17、18:47（UTC 07:17、10:47）
    # 避開整點/半點（GitHub 排程在那些時間最塞、最容易延遲或被略過）；
    # 跑兩次是保險，第二次若資料已存在會直接跳過
    - cron: "17 7 * * 1-5"
    - cron: "47 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYY-MM-DD（留空 = 今天）"
        required: false
      start:
        description: "回補起日 YYYY-MM-DD（選填）"
        required: false

permissions:
  contents: write

concurrency:
  group: fetch-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          IN_DATE: ${{ inputs.date }}
          IN_START: ${{ inputs.start }}
        run: |
          args=()
          [ -n "$IN_DATE" ] && args+=(--date "$IN_DATE")
          [ -n "$IN_START" ] && args+=(--start "$IN_START")
          # 排程（沒給日期）時抓最近 7 天：GitHub 排程常延遲好幾小時，
          # 若拖過台北午夜，只抓「今天」會漏掉前一天；已抓過/週末/假日會直接跳過，不多花時間
          if [ ${#args[@]} -eq 0 ]; then
            args+=(--start "$(TZ=Asia/Taipei date -d '7 days ago' +%F)")
          fi
          # 回補最多跑 320 分鐘，留時間 commit；沒抓完再按一次 Run workflow 會接著抓
          python fetch_daily.py --max-minutes 320 "${args[@]}"

      - name: Commit data
        if: always()  # 就算部分日期失敗，已抓到的資料也要存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # 記下這次新增/更新的 CSV，給下一步上傳 Firestore 用
          git diff --cached --name-only --diff-filter=AM -- data | grep '\.csv$' > "$RUNNER_TEMP/new_csv.txt" || true
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: daily prices $(TZ=Asia/Taipei date +%F)"
            git push
          fi

      - name: Upload to Firestore
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "未設定 FIREBASE_SERVICE_ACCOUNT secret，略過 Firestore 上傳"
            exit 0
          fi
          if [ ! -s "$RUNNER_TEMP/new_csv.txt" ]; then
            echo "這次沒有新資料"
            exit 0
          fi
          pip install --quiet firebase-admin
          python upload_firestore.py --list "$RUNNER_TEMP/new_csv.txt"
