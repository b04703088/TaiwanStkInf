name: Fetch daily stock prices

on:
  schedule:
    # 週一至週五 台北時間 15:30（UTC 07:30），收盤資料已公布
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYY-MM-DD（留空 = 今天）"
        required: false
      start:
        description: "回補起日 YYYY-MM-DD（選填）"
        required: false

permissions:
  contents: write

concurrency:
  group: fetch-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          IN_DATE: ${{ inputs.date }}
          IN_START: ${{ inputs.start }}
        run: |
          args=()
          [ -n "$IN_DATE" ] && args+=(--date "$IN_DATE")
          [ -n "$IN_START" ] && args+=(--start "$IN_START")
          python fetch_daily.py "${args[@]}"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: daily prices $(TZ=Asia/Taipei date +%F)"
            git push
          fi
