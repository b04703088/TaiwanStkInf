name: tmp margin backfill
on:
  push:
    branches: [claude/margin-data-s2bi26]
    paths: [.github/workflows/tmp-margin-backfill.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u fetch_margin.py --start 2025-07-01 --max-minutes 150
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/margin data/no_trading_days.txt
          git diff --cached --quiet && exit 0
          git commit -qm "data: margin backfill"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done
          exit 1
