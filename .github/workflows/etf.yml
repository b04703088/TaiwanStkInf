name: Fetch ETF holdings

on:
  schedule:
    # 各投信公告時間不同（元大約 16:00，其他多在晚上或隔天早上），一天跑三次補齊：
    # 台北 17:47、21:17、隔天 08:17（UTC 09:47、13:17、00:17）。
    # 檔名是投信公告的「持股基準日」，重跑只會覆寫同一天，不會重複。
    - cron: "47 9 * * 1-5"
    - cron: "17 13 * * 1-5"
    - cron: "17 0 * * 1-5"
  workflow_dispatch:
    inputs:
      etfs:
        description: "只抓指定 ETF，空白分隔（留空 = 全部）"
        required: false

permissions:
  contents: write

concurrency:
  group: fetch-etf
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          IN_ETFS: ${{ inputs.etfs }}
        run: python fetch_etf.py $IN_ETFS

      - name: Fetch AUM (all ETFs)
        if: always()
        continue-on-error: true  # 規模資料失敗不影響持股資料
        run: python fetch_etf_aum.py

      - name: Commit data
        if: always()  # 部分 ETF 失敗，抓到的也要存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: ETF holdings $(TZ=Asia/Taipei date +%F)"
          # 股價 workflow 也會 push 到同一個分支，衝突時重試
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
