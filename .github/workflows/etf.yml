name: Fetch ETF holdings

on:
  schedule:
    # 各投信公告時間不同（元大約 16:00，其他多在晚上或隔天早上），一天跑兩次補齊：
    # 台北 21:17、隔天 08:17（UTC 13:17、00:17）。原本 17:47 那次為了省 Actions 分鐘數拿掉。
    # 檔名是投信公告的「持股基準日」，重跑只會覆寫同一天，不會重複。
    - cron: "17 13 * * 1-5"
    - cron: "17 0 * * 1-5"
  workflow_dispatch:
    inputs:
      etfs:
        description: "只抓指定 ETF，空白分隔（留空 = 全部）"
        required: false

permissions:
  contents: write
  actions: write  # 有新資料時觸發網站部署

concurrency:
  group: fetch-etf
  cancel-in-progress: false

jobs:
  # cron-job.org 會準時用 workflow_dispatch 觸發（台北 08:15、18:17、21:17），GitHub 排程常延遲好幾小時才跑，
  # 變成同一時段重抓一次（約 4 分鐘）。排程觸發時，若 7 小時內已有 dispatch 跑過就跳過（cron-job.org 停掉時排程照常跑）；dispatch 一律照跑。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.dedupe.outputs.run }}
    steps:
      - id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '7 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/etf.yml/runs?per_page=20&created=%3E%3D$since" \
                --jq "[.workflow_runs[] | select(.event != \"schedule\" and .conclusion != \"cancelled\")] | length" || echo 0)
          echo "7 小時內其他 run：$n"
          if [ "$n" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  fetch:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          IN_ETFS: ${{ inputs.etfs }}
        run: python fetch_etf.py $IN_ETFS

      - name: Fetch AUM (all ETFs)
        if: always()
        continue-on-error: true  # 規模資料失敗不影響持股資料
        run: python fetch_etf_aum.py

      - name: Fetch TIP index review schedule
        if: always()
        continue-on-error: true  # 行事曆失敗不影響持股資料
        run: |
          pip install -q pdfplumber
          python fetch_tip_schedule.py
          python fetch_msci.py
          python fetch_holidays.py || true  # 證交所休市日（行事曆推算交易日用）

      - name: Detect rebalances
        if: always()
        continue-on-error: true  # 用每日持股偵測新的換股事件（不連外，幾秒鐘）
        run: python fetch_etf_rebalance.py --analyze-only

      - name: Commit data
        if: always()  # 部分 ETF 失敗，抓到的也要存
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf data/calendar
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: ETF holdings $(TZ=Asia/Taipei date +%F)"
          # 股價 workflow 也會 push 到同一個分支，衝突時重試
          for i in 1 2 3; do
            git pull --rebase -q && git push && { gh workflow run pages.yml --ref "$GITHUB_REF_NAME" || echo "觸發部署失敗（不影響資料）"; exit 0; }
            sleep 10
          done
          exit 1
