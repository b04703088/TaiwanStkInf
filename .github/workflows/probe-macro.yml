name: probe macro (temp)
on:
  push:
    branches: [claude/project-thread-iay35p]
    paths: [.github/workflows/probe-macro.yml, fetch_macro.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -u fetch_macro.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro && git commit -qm "data: macro probe" && git push || true
