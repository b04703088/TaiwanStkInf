name: Fetch industry classification

on:
  schedule:
    # 每週六台北 09:13（UTC 01:13）；產業分類很少變動，一週一次就夠
    - cron: "13 1 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-industry
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        run: python fetch_industry.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/industry
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: industry classification $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
