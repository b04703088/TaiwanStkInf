name: tmp backfill (delete before merge)
on:
  push:
    branches: [claude/project-thread-x5iz94]
    paths: [".github/workflows/tmp-backfill.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/project-thread-x5iz94}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -u - <<'PY'
          import fetch_futures as F
          from datetime import date
          for a, b in F.months(date(2024, 1, 1), date.today()):
              rows = F._get("futDataDown", {"down_type": "1", "commodity_id": "all"}, a, b)
              m = F.parse_mini(rows)
              F.upsert("mini", m)
              print(a, b, len(m), flush=True)
          PY
          cp data/futures/mini.csv /tmp/mini.csv
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin claude/project-thread-x5iz94 && git reset --hard origin/claude/project-thread-x5iz94
          cp /tmp/mini.csv data/futures/mini.csv
          git add data/futures/mini.csv; git commit -m "data: 回補小台／微台未平倉" && git push origin HEAD:claude/project-thread-x5iz94
