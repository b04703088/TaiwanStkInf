name: Fetch insider trading

on:
  # 例行排程已併到 batch.yml；這裡只留手動回補
  workflow_dispatch:
    inputs:
      month:
        description: "重抓某個月 YYYY-MM（留空 = 最近 3 個月還沒抓的）"
        required: false
      broker_minutes:
        description: "內部人分點比對最多跑幾分鐘（0 = 不跑；回補時可加大）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: fetch-insider
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          IN_MONTH: ${{ inputs.month }}
        run: |
          args=(--skip-transfer --max-minutes 50)
          [ -n "$IN_MONTH" ] && args+=(--month "$IN_MONTH")
          python fetch_insider.py "${args[@]}"

      - name: 內部人分點比對
        if: always() && inputs.broker_minutes != '' && inputs.broker_minutes != '0'
        env:
          IN_MIN: ${{ inputs.broker_minutes }}
        run: python -u fetch_insider_broker.py --max-minutes "$IN_MIN"

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insider
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: insider trading $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
