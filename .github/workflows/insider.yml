name: Fetch insider trading

on:
  # 例行排程已併到 batch.yml；這裡只留手動回補
  workflow_dispatch:
    inputs:
      month:
        description: "重抓某個月 YYYY-MM（留空 = 最近 3 個月還沒抓的）"
        required: false

permissions:
  contents: write

concurrency:
  group: fetch-insider
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          IN_MONTH: ${{ inputs.month }}
        run: |
          args=(--skip-transfer --max-minutes 50)
          [ -n "$IN_MONTH" ] && args+=(--month "$IN_MONTH")
          python fetch_insider.py "${args[@]}"

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insider
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: insider trading $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
