name: tmp-probe-psc
on:
  push:
    branches: [claude/project-thread-wqm6a0]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          U=https://cbas16889.pscnet.com.tw/marketInfo/expectedRelease/
          curl -sSL -A "Mozilla/5.0" -m 60 -o p.html "$U"
          python3 -u - <<'PY'
          import re, html
          s = open("p.html", encoding="utf-8").read()
          m = re.search(r"window\.__NUXT__=(.*?)</script>", s, re.S)
          print("NUXT len", len(m.group(1)) if m else None)
          if m: print("NUXT:", m.group(1)[:30000])
          b = re.sub(r"<style.*?</style>|<script.*?</script>", "", s, flags=re.S)
          rows = re.findall(r"<tr.*?</tr>", b, re.S)
          print("ROWS", len(rows))
          for r in rows[:400]:
              cells = [html.unescape(re.sub(r"<[^>]+>", " ", c)).split() for c in re.findall(r"<t[dh].*?</t[dh]>", r, re.S)]
              print(" | ".join(" ".join(c) for c in cells))
          if not rows:
              t = html.unescape(re.sub(r"<[^>]+>", " ", b)); print(re.sub(r"\s+", " ", t)[:20000])
          PY
