name: tmp-probe-psc
on:
  push:
    branches: [claude/project-thread-wqm6a0]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          mkdir pw && cd pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > p.js <<'JS'
          const {chromium} = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage();
            p.on('response', async r => {
              const u = r.url();
              const ty = r.request().resourceType();
              if (ty === 'xhr' || ty === 'fetch' || /api/i.test(u)) {
                let t = ''; try { t = await r.text(); } catch (e) {}
                console.log('XHR', r.request().method(), u, r.request().postData() || '', '\n', t.slice(0, 60000));
              }
            });
            await p.goto('https://cbas16889.pscnet.com.tw/marketInfo/expectedRelease/', {waitUntil: 'networkidle', timeout: 90000});
            await p.waitForTimeout(5000);
            const rows = await p.$$eval('tr', trs => trs.map(t => [...t.children].map(c => c.innerText.replace(/\s+/g, ' ').trim()).join(' | ')));
            console.log('ROWS', rows.length); rows.forEach(r => console.log(r));
            console.log('URL', p.url()); console.log('BODY', (await p.innerText('body')).slice(0, 20000));
            await b.close();
          })();
          JS
          node p.js
