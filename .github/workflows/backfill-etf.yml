name: Backfill active ETF holdings

# 一次性回補主動式 ETF 歷史持股（backfill_etf.py），給持股成本頁用。已有的日期不重抓，可重跑續補。
on:
  workflow_dispatch:
    inputs:
      etfs:
        description: "只補指定 ETF，空白分隔（留空 = 全部可回補的主動式 ETF）"
        required: false
      probe:
        description: "只試每檔幾天，不存檔"
        type: boolean
        default: false
  # 開發分支推上來時直接跑（commit 訊息含 [probe] 時只試不存）
  push:
    branches: [claude/project-thread-hm7rd6]
    paths:
      - "backfill_etf.py"
      - ".github/workflows/backfill-etf.yml"

permissions:
  contents: write

concurrency:
  group: backfill-etf
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backfill
        env:
          IN_ETFS: ${{ inputs.etfs }}
          PROBE: ${{ inputs.probe == true || contains(github.event.head_commit.message, '[probe]') }}
        run: |
          if [ "$PROBE" = "true" ]; then python backfill_etf.py --probe $IN_ETFS; else python backfill_etf.py $IN_ETFS; fi

      - name: Commit data
        if: always()  # 中途逾時或部分失敗，已補到的也要存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -q -m "data: 回補主動式 ETF 歷史持股 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
