name: tmp announce backfill
on:
  push:
    branches: [claude/project-thread-y58szi]
    paths: [.github/workflows/tmp-ann-backfill.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill
        run: |
          python -u - <<'PY'
          import fetch_treasury as F
          from datetime import datetime
          today = datetime.now(F.C.TPE).date()
          ps = F._read(F.OUT / "programs.csv")
          ann, err = F.fill_announce(ps, F._read(F.OUT / "announce.csv"), today, 75 * 60)
          F._write(F.OUT / "announce.csv", F.ANN_COLS, ann)
          print(err[:10])
          import collections
          print(collections.Counter((r["ann_date"] != "", r["ann_date"] == r["board_date"]) for r in ann))
          for r in ann:
              if r["ann_date"] and r["ann_date"] != r["board_date"]: print(r)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury/announce.csv
          git commit -m "data: treasury announce time backfill" || exit 0
          git push
