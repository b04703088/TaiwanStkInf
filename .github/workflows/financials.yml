name: Fetch financials

# 月營收（每月 10 日前公布）與季報（申報期間每天重抓），結果 commit 到 data/financials/。
# 每次例行執行之外，也會在時間上限內往回補 --since 之後還沒有的月份／季別（下次接續）。
on:
  schedule:
    - cron: "40 10 * * *"   # 台北 18:40，每天
  workflow_dispatch:
    inputs:
      since:
        description: "回補起點 YYYY-MM（空白 = 2019-01）"
        required: false
        default: ""
      only:
        description: "只抓某月營收 YYYY-MM 或某季財報 YYYYQn（空白 = 例行）"
        required: false
        default: ""
      max_minutes:
        description: "回補最多跑幾分鐘"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: fetch-financials
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          SINCE: ${{ github.event.inputs.since || '2019-01' }}
          ONLY: ${{ github.event.inputs.only }}
          MAXMIN: ${{ github.event.inputs.max_minutes || '40' }}
        run: |
          case "$ONLY" in
            *Q*|*q*) python -u fetch_financials.py --quarter "$ONLY" ;;
            ?*)      python -u fetch_financials.py --revenue "$ONLY" ;;
            *)       python -u fetch_financials.py --since "$SINCE" --max-minutes "$MAXMIN" ;;
          esac

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: financials $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
