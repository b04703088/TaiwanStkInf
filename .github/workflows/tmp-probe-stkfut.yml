name: tmp probe stkfut
on:
  push:
    branches: [claude/project-thread-dycrm6]
    paths: [.github/workflows/tmp-probe-stkfut.yml, tmp_probe/**.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -u tmp_probe/probe_stkfut.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tmp_probe/out
          git commit -m "tmp: probe stock futures large traders" || true
          git push
