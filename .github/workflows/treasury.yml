name: Fetch treasury stock

on:
  # 例行排程已併到 batch.yml；這裡只留手動回補
  workflow_dispatch:
    inputs:
      since:
        description: "董事會決議日起日 YYYY-MM-DD（留空 = 前年 1 月 1 日起）"
        required: false

permissions:
  contents: write

concurrency:
  group: fetch-treasury
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          IN_SINCE: ${{ inputs.since }}
        run: |
          if [ -n "$IN_SINCE" ]; then python fetch_treasury.py --since "$IN_SINCE"; else python fetch_treasury.py; fi

      - name: Fetch broker branches during buyback periods
        if: always()
        # 買回期間的分點買超，用來比對公司派分點；第一次要回補全部計畫，之後每次只查執行中的
        run: python fetch_treasury_broker.py --max-minutes 25

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury
          # 只有 sources.json 的時間戳變了就不算新資料
          if git diff --cached --quiet -- data/treasury ':!data/treasury/sources.json'; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: treasury stock $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
