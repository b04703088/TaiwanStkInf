name: Fetch margin trading

on:
  # 例行排程已併到 batch.yml；這裡只留手動回補
  workflow_dispatch:
    inputs:
      start:
        description: "回補起日 YYYY-MM-DD（留空 = 最近 7 天）"
        required: false

permissions:
  contents: write

concurrency:
  group: fetch-margin
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          IN_START: ${{ inputs.start }}
        run: |
          start="${IN_START:-$(TZ=Asia/Taipei date -d '7 days ago' +%F)}"
          python fetch_margin.py --start "$start" --max-minutes 160

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/margin data/pledge data/no_trading_days.txt
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: margin trading $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
