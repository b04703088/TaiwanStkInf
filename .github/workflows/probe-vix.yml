name: Probe VIX sources (temporary)
on:
  push:
    branches: [claude/project-thread-cvilc7]
    paths: [.github/workflows/probe-vix.yml]
permissions: {contents: write, actions: read}
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: research, fetch-depth: 1}
      - uses: actions/download-artifact@v4
        with: {run-id: 45644828080, github-token: "${{ github.token }}", path: research/vixchain, merge-multiple: true}
      - run: |
          ls -la research/vixchain
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/vixchain && git commit -m "temp: TXO chains" && git push
