name: Probe VIX sources (temporary)
on:
  push:
    branches: [claude/project-thread-cvilc7]
    paths: [.github/workflows/probe-vix.yml, research/vix_chain.py]
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        span: [[2016, 2018], [2019, 2021], [2022, 2024], [2025, 2026]]
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: research, fetch-depth: 1}
      - run: python -u research/vix_chain.py ${{ matrix.span[0] }} ${{ matrix.span[1] }} chain_${{ matrix.span[0] }}.csv.gz
      - uses: actions/upload-artifact@v4
        with: {name: "chain_${{ matrix.span[0] }}", path: "chain_*.csv.gz", retention-days: 3}
