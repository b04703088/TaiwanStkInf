name: Research CB broker

# 研究用：只在這個分支推送研究腳本時跑，抓 CB 詢圈前後分點買賣超
on:
  push:
    branches: [claude/project-thread-wqm6a0]
    paths: [research/cb_broker_fetch.py, .github/workflows/research-cb-broker.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/cb_broker_fetch.py --max-minutes 75
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data
          git diff --cached --quiet && exit 0
          git commit -m "research: CB 詢圈前後分點資料"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done
          exit 1
