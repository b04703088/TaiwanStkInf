name: probe analyst sources
on:
  push:
    branches: [probe-analyst]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Dump
        run: |
          mkdir -p probe_out
          python3 - <<'PY'
          import json, re, etf_common as C, fetch_analyst as A
          from datetime import date
          ids = {6532284, 6525646, 6545955, 6422903, 6225388, 6532794, 6193906, 6176201, 6537278, 6282518, 6298301, 6188420}
          out = {}
          for ds in ["2026-07-13", "2026-07-07", "2026-07-26", "2026-04-17", "2025-11-07", "2025-10-16", "2025-10-02", "2026-07-16", "2025-12-19", "2026-01-05", "2025-10-13"]:
              for cat in A.CATEGORIES:
                  for it in A.fetch_day(date.fromisoformat(ds), cat):
                      if it["newsId"] in ids:
                          out[it["newsId"]] = it
          json.dump(out, open("probe_out/news.json", "w"), ensure_ascii=False)
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe_out && git commit -qm "probe [skip ci]" && git push origin HEAD:probe-analyst -f
