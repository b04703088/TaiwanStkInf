name: TMP insider broker backfill
# 暫時：在功能分支上回補內部人分點比對資料，合併前刪除
on:
  push:
    branches: [claude/project-thread-8aykev]
    paths: [".github/workflows/tmp-insider-broker.yml"]
permissions:
  contents: write
concurrency:
  group: tmp-insider-broker
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u fetch_insider_broker.py --max-minutes 170
        continue-on-error: true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insider
          git diff --cached --quiet && exit 0
          git commit -m "data: insider broker backfill"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done
