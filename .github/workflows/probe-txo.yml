name: probe txo
on:
  push:
    branches: [claude/project-thread-w4klgq]
    paths: [".github/workflows/probe-txo.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -u fetch_futures.py --txo-only --start 2026-06-01
      - run: |
          du -sh data/futures/txo; ls data/futures/txo/2026 | wc -l; wc -l data/futures/txo/2026/20261113.csv; head -5 data/futures/txo/2026/20261113.csv
          cut -d, -f1,2 data/futures/txo/2026/20261113.csv | sort | uniq -c
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data/futures/txo && git commit -qm "回補臺指選擇權各履約價" && git push
