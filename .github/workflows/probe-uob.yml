name: probe-uob
on:
  push:
    branches: [claude/project-thread-hrd1q2]
    paths: [.github/workflows/probe-uob.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -u - <<'PY'
          import etf_common as C
          for d in ["2026/11/14","2026/11/16","2026/11/17","2026/11/18","2026/11/19","2026/11/24"]:
              try:
                  r = C.http("https://www.uobam.com.tw/api/WebSite/pcf", {"fundID": "88329556", "pcfDate": d}, insecure=True, retries=1)
                  st = [x for x in (r.get("result") or []) if x.get("kind") == "stock"]
                  print(d, "datadate=", r.get("datadate"), "etf002=", r.get("etf002"), "stocks=", len(st), "keys=", [k for k in r if k != "result"][:20])
              except Exception as e:
                  print(d, "ERR", e)
          PY
