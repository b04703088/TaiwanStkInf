name: Deploy site

on:
  # 主要的抓資料 workflow 跑完就接著部署（workflow_run 不受 GitHub 排程延遲影響），
  # 但 main 跟上次成功部署是同一個 commit（沒有新資料）就跳過，見 gate job。
  # 平日大約（台北）：15:20 股價、18:20 ETF、18:50 處置／CB／財報／法人／期交所、18:30～19:30 分點（一公布就抓）、
  #                 19:40 庫藏股／CB 分點、21:30～22:05 融資券＋盤後摘要
  workflow_run:
    workflows: ["Fetch daily stock prices", "Fetch broker branches", "Fetch ETF holdings", "Fetch batch"]
    types: [completed]
  # 固定時段當備援（GitHub 排程常延遲好幾小時；沒新資料一樣跳過）
  schedule:
    - cron: "53 0 * * 1-5"
    - cron: "3 6 * * 1-5"
    - cron: "3 12 * * 1-5"
    - cron: "3 15 * * 1-5"
    - cron: "3 4 * * 6"
  # 改了網頁或程式也立即重建（bot 的 commit 不會觸發 push 事件）
  # 只看 main：pages.yml 一律 checkout main 部署，功能分支 push 觸發只是重複部署 main
  push:
    branches: [main]
    paths:
      - "data/**"
      - "config/**"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/etf_site.py"
      - "scripts/health.py"
      - "scripts/broker_site.py"
      - "scripts/cb_site.py"
      - "scripts/industry_site.py"
      - "scripts/flow_site.py"
      - "scripts/rebalance_site.py"
      - "scripts/calendar_site.py"
      - "scripts/analyst_site.py"
      - "scripts/mops_site.py"
      - "scripts/margin_site.py"
      - "scripts/cost_site.py"
      - "scripts/asof_site.py"
      - "scripts/kline_site.py"
      - "scripts/fin_site.py"
      - "scripts/screen_site.py"
      - "scripts/chips_site.py"
      - "scripts/futures_site.py"
      - "scripts/settle_site.py"
      - "scripts/insider_site.py"
      - "scripts/stock_site.py"
      - "scripts/digest_site.py"
      - "scripts/newhigh_site.py"
      - "scripts/limitup_site.py"
      - "scripts/alert_site.py"
      - "scripts/attention_model.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read  # gate 要查上次成功部署的 commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 排程／接在抓資料後面觸發時，main 沒有比上次成功部署新就不部署
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" != workflow_run ] && [ "$EVENT" != schedule ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?branch=$BRANCH&status=success&per_page=1" \
                   --jq '.workflow_runs[0].head_sha // ""' || echo "")
          echo "main $head，上次成功部署 $last"
          if [ -n "$last" ] && [ "$head" = "$last" ]; then echo "沒有新 commit，跳過"; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  # 部署目標由 repo variable DEPLOY_TARGET 決定：
  #   cloudflare → Cloudflare Pages（私人網站，用 Cloudflare Access 限定自己的 email）
  #               需要 secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
  #               專案名稱可用 variable CF_PAGES_PROJECT 改，預設 tide-stk-infs
  #   其他／沒設 → GitHub Pages（公開）
  # 分成兩個 job：私人 repo 在免費方案不能用 deployment environment，Cloudflare 那條不綁 environment。
  cloudflare:
    needs: gate
    if: needs.gate.outputs.go == 'true' && vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 會停在觸發當時的 commit；改抓分支最新版，才包含剛 commit 的資料
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python scripts/build_site.py --days 120 --out _site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 第一次部署時自動建立專案（已存在就略過）
          preCommands: npx wrangler pages project create ${{ vars.CF_PAGES_PROJECT || 'tide-stk-infs' }} --production-branch=main || true
          command: pages deploy _site --project-name=${{ vars.CF_PAGES_PROJECT || 'tide-stk-infs' }} --branch=main --commit-dirty=true

  deploy:
    needs: gate
    if: needs.gate.outputs.go == 'true' && vars.DEPLOY_TARGET != 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 會停在觸發當時的 commit；改抓分支最新版，才包含剛 commit 的資料
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python scripts/build_site.py --days 120 --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
