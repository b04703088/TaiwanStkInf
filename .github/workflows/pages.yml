name: Deploy site

on:
  # 每日抓完股價或 ETF 持股後自動重建網站
  workflow_run:
    workflows: ["Fetch daily stock prices", "Fetch ETF holdings"]
    types: [completed]
  # 改了網頁或手動更新資料也重建（排程 bot 的 commit 不會觸發 push 事件，不會重複部署）
  push:
    paths:
      - "data/**"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/etf_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 會停在觸發當時的 commit；改抓分支最新版，才包含剛 commit 的資料
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python scripts/build_site.py --days 120 --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
