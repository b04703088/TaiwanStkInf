name: Deploy site

on:
  # 抓資料的 workflow 只 commit 資料、不觸發部署；網站在固定時段統一重建，省 Actions 分鐘數
  # 時間抓在各批資料進來之後（台北時間）：
  #   08:53 早盤前（ETF、CB、券商報告、MOPS、庫藏股、融資券）
  #   14:03 午間（券商報告、盤中重大訊息）
  #   20:03 晚間（股價、分點、CB、ETF、處置注意股、庫藏股、財報）
  #   23:03 收尾（ETF 晚場、融資券、MOPS、券商報告）
  #   週六 12:03（產業分類、指數調整、MOPS）
  # GitHub 排程常延遲；要準時可在 cron-job.org 加 workflow_dispatch
  schedule:
    - cron: "53 0 * * 1-5"
    - cron: "3 6 * * 1-5"
    - cron: "3 12 * * 1-5"
    - cron: "3 15 * * 1-5"
    - cron: "3 4 * * 6"
  # 改了網頁或程式也立即重建（bot 的 commit 不會觸發 push 事件）
  # 只看 main：pages.yml 一律 checkout main 部署，功能分支 push 觸發只是重複部署 main
  push:
    branches: [main]
    paths:
      - "data/**"
      - "config/**"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/etf_site.py"
      - "scripts/health.py"
      - "scripts/broker_site.py"
      - "scripts/cb_site.py"
      - "scripts/industry_site.py"
      - "scripts/flow_site.py"
      - "scripts/rebalance_site.py"
      - "scripts/calendar_site.py"
      - "scripts/analyst_site.py"
      - "scripts/mops_site.py"
      - "scripts/margin_site.py"
      - "scripts/kline_site.py"
      - "scripts/fin_site.py"
      - "scripts/screen_site.py"
      - "scripts/chips_site.py"
      - "scripts/futures_site.py"
      - "scripts/insider_site.py"
      - "scripts/stock_site.py"
      - "scripts/digest_site.py"
      - "scripts/newhigh_site.py"
      - "scripts/limitup_site.py"
      - "scripts/alert_site.py"
      - "scripts/attention_model.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 部署目標由 repo variable DEPLOY_TARGET 決定：
  #   cloudflare → Cloudflare Pages（私人網站，用 Cloudflare Access 限定自己的 email）
  #               需要 secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
  #               專案名稱可用 variable CF_PAGES_PROJECT 改，預設 tide-stk-infs
  #   其他／沒設 → GitHub Pages（公開）
  # 分成兩個 job：私人 repo 在免費方案不能用 deployment environment，Cloudflare 那條不綁 environment。
  cloudflare:
    if: vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 會停在觸發當時的 commit；改抓分支最新版，才包含剛 commit 的資料
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python scripts/build_site.py --days 120 --out _site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 第一次部署時自動建立專案（已存在就略過）
          preCommands: npx wrangler pages project create ${{ vars.CF_PAGES_PROJECT || 'tide-stk-infs' }} --production-branch=main || true
          command: pages deploy _site --project-name=${{ vars.CF_PAGES_PROJECT || 'tide-stk-infs' }} --branch=main --commit-dirty=true

  deploy:
    if: vars.DEPLOY_TARGET != 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 會停在觸發當時的 commit；改抓分支最新版，才包含剛 commit 的資料
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python scripts/build_site.py --days 120 --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
