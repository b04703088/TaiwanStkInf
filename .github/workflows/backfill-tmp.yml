name: backfill chips (temporary)
on:
  push:
    branches: [claude/project-thread-ytdtq4]
    paths: [.github/workflows/backfill-tmp.yml]
permissions:
  contents: write
jobs:
  futures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_futures.py --start 2026-10-01
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/futures
          git commit -qm "data: futures 2026-10" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q && git push && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
