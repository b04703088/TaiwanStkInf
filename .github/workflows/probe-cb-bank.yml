name: probe cb bank (temp)
on:
  push:
    branches: [claude/project-thread-14qhem]
    paths: [research/probe_cb_bank.py, .github/workflows/probe-cb-bank.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pdfplumber openpyxl && python -u research/probe_cb_bank.py
