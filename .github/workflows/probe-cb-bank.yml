name: probe cb bank (temp)
on:
  push:
    branches: [claude/project-thread-14qhem]
    paths: [fetch_cb_pre.py, .github/workflows/probe-cb-bank.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q pdfplumber openpyxl
          python -u fetch_cb_pre.py --max-minutes 3 --detail-minutes 20 || true
          echo "=====DETAILS"; cat data/cb/mops_details.csv
          echo "=====PRICE"; grep ",price," data/cb/mops_events.csv || true
          echo "=====END"
