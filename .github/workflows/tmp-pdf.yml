name: tmp pdf (delete before merge)
on:
  push:
    branches: [claude/project-thread-x5iz94]
    paths: [".github/workflows/tmp-pdf.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/project-thread-x5iz94}
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p tmp_memo
          for f in 245120261106M001 245420261030M001 230320261028M001; do
            curl -sSL -A "Mozilla/5.0" -o tmp_memo/$f.pdf https://mopsov.twse.com.tw/nas/STR/$f.pdf
            ls -la tmp_memo/$f.pdf; pdftotext -layout tmp_memo/$f.pdf tmp_memo/$f.txt; wc -c tmp_memo/$f.txt
            sleep 3
          done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_memo; git commit -m "tmp: 法說簡報試做" || true
          git pull --rebase origin claude/project-thread-x5iz94 && git push origin HEAD:claude/project-thread-x5iz94
