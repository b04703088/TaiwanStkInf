name: probe-fin (temporary)
on:
  push:
    branches: [claude/project-thread-ju16iv]
    paths: [".github/workflows/probe-fin.yml"]
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -u fetch_financials.py --since 2025-01 --max-minutes 60 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials
          git commit -m "data: financials seed 2025-01 起"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done
          exit 1
