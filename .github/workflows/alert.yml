name: Fetch disposal & attention stocks

on:
  # 例行排程已併到 batch.yml；這裡只留手動回補
  workflow_dispatch:
    inputs:
      start:
        description: "回補起日 YYYY-MM-DD（空白 = 最近 10 天）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-alert
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          START: ${{ github.event.inputs.start }}
        run: |
          if [ -n "$START" ]; then python fetch_alert.py --start "$START"; else python fetch_alert.py; fi

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alert
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: 處置／注意股 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
