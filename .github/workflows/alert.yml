name: Fetch disposal & attention stocks

on:
  schedule:
    # 台北 18:47（處置、注意股盤後公告）與隔天 07:47 補抓（UTC 10:47 週一至五、23:47 週日至四）
    - cron: "47 10 * * 1-5"
    - cron: "47 23 * * 0-4"
  workflow_dispatch:
    inputs:
      start:
        description: "回補起日 YYYY-MM-DD（空白 = 最近 10 天）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-alert
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          START: ${{ github.event.inputs.start }}
        run: |
          if [ -n "$START" ]; then python fetch_alert.py --start "$START"; else python fetch_alert.py; fi

      # 還原股價事件（原本 adjust.yml 18:53 自己跑一個 job；併到這裡省一次 job 的分鐘數，回補仍用 adjust.yml 手動跑）
      - name: Fetch adjust events
        if: always() && github.event_name == 'schedule'
        continue-on-error: true  # 還原事件失敗不影響處置／注意股
        run: python -u fetch_adjust.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alert data/adjust
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: 處置／注意股 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
