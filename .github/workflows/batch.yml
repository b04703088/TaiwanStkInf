name: Fetch batch

# 小爬蟲濃縮成三個時段，每個時段一個 job 依序跑（省 Actions 分鐘數：每個 job 都會進位成整分鐘，
# 也省掉重複的 checkout／setup-python）。一支失敗不影響其他支，最後統一 commit 一次。
# 原本各自的 workflow（mops、cb、analyst、treasury、alert、margin、financials、insider）只留手動回補。
#
#   早上 08:30  MOPS 公告、可轉債、分析師、庫藏股、處置股（盤前補抓）、融資融券（補抓）、國際金融
#   傍晚 18:40  處置股＋還原事件、可轉債、MOPS 公告、財報、內部人（每月 18～28 日）
#   晚上 21:40  融資融券、MOPS 公告、分析師、庫藏股＋買回期間分點、三大法人／借券／當沖、期交所籌碼、國際金融、盤後數字摘要
#   週末只跑：早上 分析師、MOPS 公告、集保股權分散；傍晚 財報、內部人；晚上 分析師
# 每日股價、券商分點、ETF 由 cron-job.org 準時觸發且有先後關係，不在這裡。
#
# GitHub 排程常延遲 3～6 小時（10/28 晚班拖到隔天 00:24 才跑，盤後判讀跟著晚）。
# 所以平日改成接在 ETF 後面跑：ETF 由 cron-job.org 準時在 08:15／18:17／21:17 觸發，
# 跑完就帶起這裡對應的時段，並等到原本的 08:30／18:40／21:40 才開始抓。
# 原本的排程留著當備援：延遲的排程若發現同一時段 8 小時內已經 commit 過就跳過。
on:
  schedule:
    - cron: "30 0 * * 1-5"    # 台北 08:30 平日
    - cron: "30 0 * * 0,6"    # 台北 08:30 週末
    - cron: "40 10 * * 1-5"   # 台北 18:40 平日
    - cron: "40 10 * * 0,6"   # 台北 18:40 週末
    - cron: "40 13 * * 1-5"   # 台北 21:40 平日
    - cron: "40 13 * * 0,6"   # 台北 21:40 週末
  workflow_run:
    workflows: ["Fetch ETF holdings"]
    types: [completed]
  workflow_dispatch:
    inputs:
      slot:
        description: "時段"
        type: choice
        options: [morning, evening, night]
        default: evening
      weekend:
        description: "當成週末跑"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-batch
  cancel-in-progress: false

jobs:
  fetch:
    # 只接 cron-job.org 準時觸發的 ETF；ETF 自己的排程也常延遲，不接
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick jobs for this slot
        id: s
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IN_SLOT: ${{ inputs.slot }}
          IN_WEEKEND: ${{ inputs.weekend }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$CRON" in
            "30 0 "*)  slot=morning ;;
            "40 10 "*) slot=evening ;;
            "40 13 "*) slot=night ;;
            *)         slot="$IN_SLOT" ;;
          esac
          if [ -n "$CRON" ]; then
            case "$CRON" in *"0,6") wk=0 ;; *) wk=1 ;; esac
          elif [ "$EVENT" = "workflow_run" ]; then
            [ "$(TZ=Asia/Taipei date +%u)" -ge 6 ] && wk=0 || wk=1
          else
            [ "$IN_WEEKEND" = "true" ] && wk=0 || wk=1
          fi

          if [ "$EVENT" = "workflow_run" ]; then
            # 依台北時間對應時段，等到原本的開抓時間（資料公布時間沒變）
            hm=$((10#$(TZ=Asia/Taipei date +%H%M)))
            if   [ $hm -ge 700 ]  && [ $hm -lt 1000 ]; then slot=morning; at=830
            elif [ $hm -ge 1700 ] && [ $hm -lt 2000 ]; then slot=evening; at=1840
            elif [ $hm -ge 2030 ] && [ $hm -lt 2330 ]; then slot=night;   at=2140
            else echo "台北 $hm 不在任何時段，跳過"; echo "slot=skip" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ $hm -lt $at ]; then
              wait=$(( ($at/100*60 + $at%100) - ($hm/100*60 + $hm%100) ))
              echo "等 $wait 分鐘到 $at 再抓"; sleep $(( wait * 60 ))
            fi
          elif [ -n "$CRON" ]; then
            # 延遲的排程：同一時段 8 小時內已經 commit 過就不再跑
            since=$(date -u -d '8 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            if gh api "repos/$GITHUB_REPOSITORY/commits?sha=${{ github.event.repository.default_branch }}&since=$since&per_page=100" \
                 --jq '.[].commit.message' | grep -q "^data: batch $slot "; then
              echo "$slot 8 小時內已跑過，跳過"; echo "slot=skip" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          dom=$(TZ=Asia/Taipei date +%-d)
          on() { echo "$1=1" >> "$GITHUB_OUTPUT"; }
          case "$slot" in
            morning)
              on analyst; on mops
              [ $wk = 0 ] && on tdcc
              [ $wk = 1 ] && on macro
              if [ $wk = 1 ]; then on cb; on treasury; on alert; on margin; fi ;;
            evening)
              on financials
              [ "$dom" -ge 18 ] && [ "$dom" -le 28 ] && on insider
              if [ $wk = 1 ]; then on alert; on adjust; on cb; on mops; fi ;;
            night)
              on analyst
              if [ $wk = 1 ]; then on margin; on mops; on treasury; on treasury_broker; on chips; on macro; fi ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "時段 $slot，平日=$wk，日期 $dom"; cat "$GITHUB_OUTPUT"

      - name: 處置／注意股
        if: always() && steps.s.outputs.alert == '1'
        continue-on-error: true
        run: python fetch_alert.py

      - name: 還原股價事件
        if: always() && steps.s.outputs.adjust == '1'
        continue-on-error: true
        run: python -u fetch_adjust.py

      - name: MOPS 公告
        if: always() && steps.s.outputs.mops == '1'
        continue-on-error: true
        run: python fetch_mops_news.py --max-minutes 20

      - name: 可轉債 董事會／送件
        if: always() && steps.s.outputs.cb == '1'
        continue-on-error: true
        run: |
          pip install -q pdfplumber openpyxl
          python fetch_cb_pre.py --max-minutes 20

      - name: 可轉債 詢圈
        if: always() && steps.s.outputs.cb == '1'
        continue-on-error: true
        run: |
          pip install -q pdfplumber
          python fetch_cb.py

      - name: 分析師報告
        if: always() && steps.s.outputs.analyst == '1'
        continue-on-error: true
        run: python fetch_analyst.py --days 3

      - name: 庫藏股
        if: always() && steps.s.outputs.treasury == '1'
        continue-on-error: true
        run: python fetch_treasury.py

      - name: 庫藏股 買回期間分點
        if: always() && steps.s.outputs.treasury_broker == '1'
        continue-on-error: true
        # 分點資料收盤後才更新，一天查一次就夠
        run: python fetch_treasury_broker.py --max-minutes 25

      - name: 融資融券
        if: always() && steps.s.outputs.margin == '1'
        continue-on-error: true
        run: python fetch_margin.py --start "$(TZ=Asia/Taipei date -d '7 days ago' +%F)" --max-minutes 60

      - name: 財報
        if: always() && steps.s.outputs.financials == '1'
        continue-on-error: true
        run: python -u fetch_financials.py --since 2019-01 --max-minutes 40

      - name: 內部人持股異動
        if: always() && steps.s.outputs.insider == '1'
        continue-on-error: true
        run: python fetch_insider.py --skip-transfer --max-minutes 50

      - name: 三大法人、借券賣出、當沖
        if: always() && steps.s.outputs.chips == '1'
        continue-on-error: true
        # 借券、當沖約 21:00 公布；當沖 T+2 才定案，近 4 天每次重抓
        run: python fetch_chips.py --start "$(TZ=Asia/Taipei date -d '7 days ago' +%F)" --refresh 4 --max-minutes 30

      - name: 期貨選擇權籌碼
        if: always() && steps.s.outputs.chips == '1'
        continue-on-error: true
        run: python fetch_futures.py

      - name: 匯率、美債、美元、VIX、信用利差
        if: always() && steps.s.outputs.macro == '1'
        continue-on-error: true
        # 給盤後摘要的資金水龍頭用；早上補美股收盤後的數字
        run: python -u fetch_macro.py

      - name: 盤後數字摘要
        if: always() && steps.s.outputs.chips == '1'
        continue-on-error: true
        # 法人、期權、融資都進來後才算；給每晚判讀與盤後摘要頁用（data/digest/）
        run: |
          pip install -q pandas
          python scripts/digest.py

      - name: 集保股權分散
        if: always() && steps.s.outputs.tdcc == '1'
        continue-on-error: true
        run: python fetch_tdcc.py

      - name: Commit data
        if: always()
        env:
          SLOT: ${{ steps.s.outputs.slot }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "不是預設分支（測試用），只列出變動、不 commit"; git diff --cached --stat | tail -20; exit 0
          fi
          # 只有庫藏股 sources.json 的時間戳變了就不算新資料
          if git diff --cached --quiet -- data ':!data/treasury/sources.json'; then
            echo "No new data"
            exit 0
          fi
          git commit -q -m "data: batch $SLOT $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
